# Living Dictionary OpenResty host.
#
#     mkdir -p openresty/logs
#     openresty -p "$PWD/openresty" -c nginx.conf
#
# Prefix is this directory. init_by_lua puts openresty/lua and a sibling
# shen-lua checkout on package.path. Shen boots once per worker.

env HOME;
env USER;
env PATH;
env XAI_API_KEY;
env GROK_HOME;
env LIVINGDICT_MODEL;
env PYTHON;

daemon off;
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;

events { worker_connections 256; }

http {
    access_log logs/access.log;
    include mime.types;
    default_type application/octet-stream;
    client_max_body_size 8m;

    init_by_lua_block {
        local prefix = ngx.config.prefix()
        package.path = prefix .. "lua/?.lua;" .. prefix .. "?.lua;" .. package.path
        local candidates = {}
        local function add(dir)
            if dir and dir ~= "" then
                candidates[#candidates + 1] = dir
            end
        end
        add(os.getenv("SHEN_LUA_DIR"))
        add(prefix .. "vendor/shen-lua")
        add(prefix .. "../vendor/shen-lua")
        add(prefix .. "../shen-lua")
        add(prefix .. "../../shen-lua")
        for i = 1, #candidates do
            local dir = candidates[i]
            local f = io.open(dir .. "/shen.lua", "r")
            if f then
                f:close()
                package.path = dir .. "/?.lua;" .. package.path
                break
            end
        end
    }

    # Boot Shen ONCE per worker (kernel + typed contracts + critic).
    # Never require("bridge").boot() on the request path.
    init_worker_by_lua_block {
        local prefix = ngx.config.prefix()
        local hostmod = require("host")
        hostmod.mkdir_p(prefix .. "var/run/think/dictionary/words")
        hostmod.mkdir_p(prefix .. "../apps/studio")
        hostmod.mkdir_p(prefix .. "logs")
        local bridge = require("bridge")
        bridge.boot()
    }

    server {
        listen 8080;

        set_by_lua_block $livingdict_workspace {
            return ngx.config.prefix() .. "../apps/studio"
        }

        location = /health {
            content_by_lua_block {
                local bridge = require("bridge")
                ngx.status = 200
                ngx.header.content_type = "application/json"
                local prefix = ngx.config.prefix()
                local hostmod = require("host")
                local ws = ngx.var.livingdict_workspace
                local product = nil
                if hostmod.is_file(ws .. "/dist/index.html") then
                    product = "/product/"
                end
                ngx.say(hostmod.encode_json({
                    critic = bridge.engine,
                    dictionary = prefix .. "var/run/think/dictionary",
                    ok = true,
                    max_turns = tonumber(os.getenv("LIVINGDICT_MAX_TURNS")) or 32,
                    product_url = product,
                    shen = bridge.available,
                    workspace = ws,
                }))
            }
        }

        location = /think {
            content_by_lua_block { require("agent").handle() }
        }

        set_by_lua_block $product_dist {
            return ngx.var.livingdict_workspace .. "/dist/"
        }

        location /product/ {
            alias $product_dist;
        }

        location /scene/ {
            alias $product_dist;
        }

        location / {
            root public;
            try_files $uri $uri/ /index.html;
        }
    }
}
