[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livingdict"
version = "0.0.1"
description = "Capability host and (later) Forth coding-agent harness"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
livingdict = "livingdict.cli:main"
livingdict-policy = "livingdict.policy_eval:main"

[tool.setuptools.packages.find]
where = ["src"]
