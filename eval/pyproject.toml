[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-dictionary-eval"
version = "0.1.0"
description = "A mechanism-focused benchmark for executable-plan coding-agent harnesses"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Living Dictionary Eval contributors"}]

[project.scripts]
ldeval = "ldeval.cli:main"

[tool.setuptools]
packages = ["ldeval"]

