[workspace]
members = ["executor", "ld-wasm", "guest-sdk", "guests/kv", "guests/order", "guests/bad-snapshot"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
rand_chacha = "0.9.0"
rand_core = "0.9.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_jcs = "0.1.0"
sha2 = "0.10.9"
toml = "0.9.8"
wit-bindgen = "0.46.0"
wasmtime = { version = "48.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
