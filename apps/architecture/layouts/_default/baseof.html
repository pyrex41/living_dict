<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Description | default site.Params.description }}">
    <meta name="theme-color" content="#10130f">
    <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
    <title>{{ .Title }} — an executable architecture</title>
    {{ $styles := resources.Get "styles.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
  </head>
  <body>
    {{ block "main" . }}{{ end }}
    {{ $script := resources.Get "interactions.js" | minify | fingerprint }}
    <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
  </body>
</html>
